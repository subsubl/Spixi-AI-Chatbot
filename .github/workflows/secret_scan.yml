name: Secret Scanning (Gitleaks)

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  gitleaks-scan:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        id: gitleaks
        uses: gitleaks/gitleaks-action@v8
        with:
          args: --path=. --verbose --report-format=json --report-path=reports/gitleaks-report.json --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks-report.json
